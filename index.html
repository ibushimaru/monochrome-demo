<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>夏希と放課後</title><link rel="stylesheet" href="style.css"></head>
<body><main class="game">
<header><h1>日向 夏希</h1><div class="affection"><div class="meter-label"><span>好感度</span><span id="score">0 / 100</span></div><progress id="meter" max="100" value="0" aria-label="夏希の好感度"></progress><span id="relationship">まだ知り合い</span></div></header>
<section class="scene" aria-label="夏希との会話"><div class="portrait"><img id="portrait" src="assets/natsuki/neutral.png" alt="少し警戒した表情の夏希" fetchpriority="high"></div><div class="bubble" aria-live="polite" aria-atomic="true"><span class="speaker">夏希</span><p id="line">あれ、まだ帰ってなかったんだ。何か用？</p></div></section>
<section class="controls" aria-label="行動"><div id="choices" class="choices" hidden></div><div class="actions"><button id="talk">話す</button><button id="pat">頭を撫でる</button><button id="wait">ひと休み</button></div><div class="bottom"><span id="feedback" role="status">まずは話しかけてみよう。</span><button id="reset" class="reset">やり直す</button></div></section>
<dialog id="confirm"><p>夏希との会話を最初からやり直す？</p><form method="dialog"><button value="cancel">続ける</button><button value="reset">やり直す</button></form></dialog>
</main><script src="game.js"></script><script src="app.js"></script></body></html>
