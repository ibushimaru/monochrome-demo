[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="*.json,*.txt"
exclude_filter="tests/*,assets/NotoSansJP.ttf,assets/calm.png,assets/smile.png,assets/wary.png,assets/block.png,assets/full-block.png,assets/full-body-draft.png"
export_path="../stage1/index.html"
[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/head_include="<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">"
progressive_web_app/enabled=false
