[preset.0]
name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="*.json,*.txt"
exclude_filter="tests/*,assets/NotoSansJP.ttf,assets/calm.png,assets/smile.png,assets/wary.png,assets/block.png,assets/full-block.png,assets/full-body-draft.png"
export_path="../builds/windows/NatsukiStage1.exe"
[preset.0.options]
custom_template/debug=""
custom_template/release=""
binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=false
debug/export_console_wrapper=0

[preset.1]
name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="*.json,*.txt"
exclude_filter="tests/*,assets/NotoSansJP.ttf,assets/calm.png,assets/smile.png,assets/wary.png,assets/block.png,assets/full-block.png,assets/full-body-draft.png"
export_path="../builds/macos/NatsukiStage1.zip"
[preset.1.options]
export/distribution_type=1
binary_format/architecture="universal"
application/bundle_identifier="com.ibushimaru.natsuki.stage1"
application/short_version="0.1.0"
application/version="0.1.0"
application/min_macos_version="12.0"
codesign/codesign=1
notarization/notarization=0
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true
