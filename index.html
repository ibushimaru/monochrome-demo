<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>夏希と放課後</title><link rel="stylesheet" href="style.css?v=6"></head>
<body><main class="game"><header><h1>日向 夏希</h1><div class="affection"><div class="meter-label"><span>好感度</span><span id="score">0 / 100</span></div><progress id="meter" max="100" value="0" aria-label="夏希の好感度"></progress><span id="relationship">まだ知り合い</span></div></header>
<section class="scene" aria-label="夏希"><div class="stage"><img id="portrait" src="assets/natsuki/illustration-v2.png" alt="夏希の立ち絵" fetchpriority="high"><img id="hand" src="assets/natsuki/hand-transparent-v2.png" alt="" aria-hidden="true" hidden><button id="head" aria-label="夏希の頭をそっと撫でる" title="頭を撫でる"></button><div id="bubble" class="bubble" role="status" aria-live="polite"><svg class="bubble-shape" viewBox="0 0 180 110" preserveAspectRatio="none" aria-hidden="true"><path d="M30 2H150Q178 2 178 28V82Q178 108 150 108H30Q4 108 4 82V74L-12 82L4 55V28Q4 2 30 2Z"/></svg><p id="line">……なに？</p></div></div></section>
<footer><span id="hint">頭のあたりをタップ</span><button id="reset">やり直す</button></footer>
<dialog id="confirm"><p>最初からやり直す？</p><form method="dialog"><button value="cancel">続ける</button><button value="reset">やり直す</button></form></dialog>
</main><script src="game.js?v=6"></script><script src="app.js?v=6"></script></body></html>
